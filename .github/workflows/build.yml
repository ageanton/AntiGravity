name: Build AntiGravity macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "AntiGravity"
  DISPLAY_NAME: "AntiGravity"
  BUNDLE_ID: "com.antigravity.studio.macos"
  VERSION: "1.0.0"
  BUILD_NUMBER: "100"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 AntiGravity Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Patch Build Script
        run: |
          if [ ! -f "motif_build_v12.txt" ]; then
            echo "Fetching base build script from Macos-amama-single-git..."
            curl -fsSL https://raw.githubusercontent.com/ageanton/Macos-amama-single-git/main/motif_build_v12.txt -o motif_build_v12.txt
          fi
          python3 patch_build.py

      - name: Run AntiGravity Build Script
        run: |
          chmod +x motif_build_v12.txt
          bash --noprofile --norc -e -o pipefail ./motif_build_v12.txt

      - name: Upload Compiled DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: AntiGravity-macOS-AppleSilicon-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 30
