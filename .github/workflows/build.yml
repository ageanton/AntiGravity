name: Build AntiGravity macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "AntiGravity"
  DISPLAY_NAME: "AntiGravity"
  BUNDLE_ID: "com.antigravity.studio.macos"
  VERSION: "1.0.0"
  BUILD_NUMBER: "100"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 AntiGravity Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Patch Build Script
        run: |
          if [ ! -f "motif_build_v12.txt" ]; then
            echo "Fetching base build script from Macos-amama-single-git..."
            curl -fsSL https://raw.githubusercontent.com/ageanton/Macos-amama-single-git/main/motif_build_v12.txt -o motif_build_v12.txt
          fi
          python3 patch_build.py

      - name: Run AntiGravity Build Script
        run: |
          chmod +x motif_build_v12.txt
          ./motif_build_v12.txt 2>&1 | tee build.log

      - name: Publish Build Log Summary
        if: always()
        run: |
          echo "### Build Log (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No build.log found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AntiGravity-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Compiled DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: AntiGravity-macOS-AppleSilicon-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 30
