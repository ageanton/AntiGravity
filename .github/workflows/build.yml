name: Build BlackMotif macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 BlackMotif Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Package App from Newappfile.txt
        run: |
          set -e
          echo "Starting build pointing to Newappfile.txt..."
          if head -n 5 Newappfile.txt | grep -q "name:"; then
            echo "Extracting and executing workflow steps from Newappfile.txt..."
            echo 'use strict;' > run_build.pl
            echo 'use warnings;' >> run_build.pl
            echo 'open my $fh, "<", "Newappfile.txt" or die $!;' >> run_build.pl
            echo 'my $content = do { local $/; <$fh> };' >> run_build.pl
            echo 'close $fh;' >> run_build.pl
            echo '$content =~ s/public struct BlackMotifApp: App/struct BlackMotifApp: App/g;' >> run_build.pl
            echo '$content =~ s/(\s*)for try await line in followBytes\.lines \{/$1do {\n$1    for try await line in followBytes.lines {/g;' >> run_build.pl
            echo '$content =~ s/(\s*)parser\.flushPendingBufferWithoutLosingState\(markComplete: true\)/$1    }\n$1} catch {}\n$1parser.flushPendingBufferWithoutLosingState(markComplete: true)/g;' >> run_build.pl
            echo 'my $t3 = "commitActiveRenameIfNeeded()\n                          }\n                      }\n                  }\n              }\n\n              // MARK: - In-Place Archive View";' >> run_build.pl
            echo 'my $r3 = "commitActiveRenameIfNeeded()\n                          }\n                      }\n                  }\n\n              // MARK: - In-Place Archive View";' >> run_build.pl
            echo '$content =~ s/\Q$t3\E/$r3/g;' >> run_build.pl
            echo 'if ($content =~ /env:\s*\n(.*?)\njobs:/s) {' >> run_build.pl
            echo '    for my $l (split /\n/, $1) {' >> run_build.pl
            echo '        if ($l =~ /^\s*([A-Za-z0-9_]+):\s*["\x27]?(.*?)["\x27]?\s*$/) {' >> run_build.pl
            echo '            $ENV{$1} = $2;' >> run_build.pl
            echo '        }' >> run_build.pl
            echo '    }' >> run_build.pl
            echo '}' >> run_build.pl
            echo 'while ($content =~ /-\s*name:\s*([^\n]+)\s*\n\s*run:\s*\|\n(.*?)(?=\n\s*(?:-\s*name:|\Z))/sg) {' >> run_build.pl
            echo '    my ($name, $code) = ($1, $2);' >> run_build.pl
            echo '    $code =~ s/^[ ]{10}//mg;' >> run_build.pl
            echo '    print "\n===== [RUN] $name =====\n";' >> run_build.pl
            echo '    system("bash", "-e", "-c", $code) == 0 or die "FAILED STEP: $name\n";' >> run_build.pl
            echo '}' >> run_build.pl
            perl run_build.pl 2>&1 | tee build.log
            test ${PIPESTATUS[0]} -eq 0
          else
            chmod +x Newappfile.txt
            ./Newappfile.txt 2>&1 | tee build.log
            test ${PIPESTATUS[0]} -eq 0
          fi

      - name: Commit Build Log to Main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.log || true
          git commit -m "Auto-commit build log [skip ci]" || true
          git push origin main || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackMotif-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Compiled DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: BlackMotif-macOS-AppleSilicon-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 30
