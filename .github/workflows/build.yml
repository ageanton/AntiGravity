name: Build AntiGravity macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "AntiGravity"
  DISPLAY_NAME: "AntiGravity"
  BUNDLE_ID: "com.antigravity.studio.macos"
  VERSION: "1.0.0"
  BUILD_NUMBER: "100"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 AntiGravity Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup and Patch AntiGravity Build Script
        run: |
          if [ ! -f "motif_build_v12.txt" ]; then
            echo "Fetching base build script from repository source..."
            curl -fsSL https://raw.githubusercontent.com/ageanton/Macos-amama-single-git/main/motif_build_v12.txt -o motif_build_v12.txt
          fi

          ruby - << 'RUBYEOF'
          text = File.read("motif_build_v12.txt")

          old_parser_start = "// MARK: - Stop-Safe Stateful Thinking Stream Parser\npublic final class StatefulThinkingStreamParser {"
          old_parser_end = "    private func trailingPartialTagIndex(in text: String, tags: [String]) -> String.Index? {\n        guard let lastAngle = text.lastIndex(of: \"<\") else { return nil }\n        let suffix = String(text[lastAngle...])\n        for tag in tags {\n            if tag.hasPrefix(suffix) && suffix.count < tag.count {\n                return lastAngle\n            }\n        }\n        return nil\n    }\n}"

          new_parser = <<'EOF'.strip
// MARK: - Stop-Safe Stateful Thinking Stream Parser
public final class StatefulThinkingStreamParser {
    public enum State {
        case normalOrAwaitingOpeningTag
        case insideThinkingBlock
        case postThinkingAnswer
    }

    public private(set) var state: State = .normalOrAwaitingOpeningTag
    private var pendingBuffer: String = ""
    private var hasReceivedExplicitThinkingChannel: Bool = false
    private let openTags = [
        "<think>", "<thought>", "<reasoning>", "<|thought|>",
        "<|begin_of_thought|>", "<|start_of_thought|>",
        "<｜begin of thinking｜>"
    ]
    private let closeTags = [
        "</think>", "</thought>", "</reasoning>", "<|/thought|>",
        "<|end_of_thought|>", "<|endofthought|>", "<end_of_thought>",
        "<｜end of thinking｜>", "</details>"
    ]

    public private(set) var accumulatedThinking: String = ""
    public private(set) var accumulatedAnswer: String = ""
    public private(set) var isCurrentlyThinking: Bool = false
    public private(set) var thinkingStartTime: Date?
    public private(set) var thinkingDurationSeconds: Double = 0.0

    public init() {}

    public func preloadExisting(
        thinking: String,
        answer: String,
        resumeInsideThinking: Bool,
        priorThinkingDuration: Double = 0.0
    ) {
        accumulatedThinking = thinking
        accumulatedAnswer = answer
        thinkingDurationSeconds = priorThinkingDuration
        if resumeInsideThinking {
            state = .insideThinkingBlock
            isCurrentlyThinking = true
            thinkingStartTime = Date().addingTimeInterval(-priorThinkingDuration)
        } else if !thinking.isEmpty || !answer.isEmpty {
            state = .postThinkingAnswer
            isCurrentlyThinking = false
        } else {
            state = .normalOrAwaitingOpeningTag
            isCurrentlyThinking = false
        }
    }

    public func ingestExplicitThinkingDelta(_ delta: String) {
        guard !delta.isEmpty else { return }
        hasReceivedExplicitThinkingChannel = true
        state = .insideThinkingBlock
        if thinkingStartTime == nil {
            thinkingStartTime = Date()
        }
        isCurrentlyThinking = true
        accumulatedThinking += delta
        if let start = thinkingStartTime {
            thinkingDurationSeconds = Date().timeIntervalSince(start)
        }
    }

    public func ingestContentChunk(_ chunk: String) {
        guard !chunk.isEmpty else { return }
        if hasReceivedExplicitThinkingChannel && state == .insideThinkingBlock {
            transitionToPostThinkingAnswer()
        }
        pendingBuffer += chunk
        processBuffer()
    }

    public func transitionToPostThinkingAnswer() {
        if !pendingBuffer.isEmpty {
            if state == .insideThinkingBlock {
                accumulatedThinking += pendingBuffer
            } else {
                accumulatedAnswer += pendingBuffer
            }
            pendingBuffer = ""
        }
        state = .postThinkingAnswer
        isCurrentlyThinking = false
        if let start = thinkingStartTime, thinkingDurationSeconds == 0 {
            thinkingDurationSeconds = Date().timeIntervalSince(start)
        }
    }

    public func flushPendingBufferWithoutLosingState(markComplete: Bool) {
        if !pendingBuffer.isEmpty {
            switch state {
            case .insideThinkingBlock:
                accumulatedThinking += pendingBuffer
            case .normalOrAwaitingOpeningTag, .postThinkingAnswer:
                accumulatedAnswer += pendingBuffer
            }
            pendingBuffer = ""
        }
        if let start = thinkingStartTime, isCurrentlyThinking {
            thinkingDurationSeconds = Date().timeIntervalSince(start)
        }
        if markComplete {
            isCurrentlyThinking = false
        }
    }

    private func processBuffer() {
        var keepProcessing = true
        while keepProcessing && !pendingBuffer.isEmpty {
            keepProcessing = false

            switch state {
            case .normalOrAwaitingOpeningTag:
                if let match = findFirstTag(in: pendingBuffer, tags: openTags) {
                    let prefix = String(pendingBuffer[..<match.range.lowerBound])
                    if !prefix.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                        accumulatedAnswer += prefix
                    }
                    pendingBuffer.removeSubrange(..<match.range.upperBound)
                    state = .insideThinkingBlock
                    isCurrentlyThinking = true
                    if thinkingStartTime == nil {
                        thinkingStartTime = Date()
                    }
                    keepProcessing = true
                } else if let closeMatch = findFirstTag(in: pendingBuffer, tags: closeTags) {
                    let thoughtSegment = String(pendingBuffer[..<closeMatch.range.lowerBound])
                    accumulatedThinking += accumulatedAnswer + thoughtSegment
                    accumulatedAnswer = ""
                    pendingBuffer.removeSubrange(..<closeMatch.range.upperBound)
                    if pendingBuffer.hasPrefix("\n") {
                        pendingBuffer.removeFirst()
                    }
                    state = .postThinkingAnswer
                    isCurrentlyThinking = false
                    keepProcessing = true
                } else if let partialIdx = trailingPartialTagIndex(in: pendingBuffer, tags: openTags + closeTags) {
                    let safePrefix = String(pendingBuffer[..<partialIdx])
                    accumulatedAnswer += safePrefix
                    pendingBuffer.removeSubrange(..<partialIdx)
                } else {
                    if isCurrentlyThinking && !accumulatedThinking.isEmpty {
                        if let start = thinkingStartTime {
                            thinkingDurationSeconds = Date().timeIntervalSince(start)
                        }
                        isCurrentlyThinking = false
                    }
                    accumulatedAnswer += pendingBuffer
                    pendingBuffer = ""
                }

            case .insideThinkingBlock:
                if let start = thinkingStartTime {
                    thinkingDurationSeconds = Date().timeIntervalSince(start)
                }
                if let match = findFirstTag(in: pendingBuffer, tags: closeTags) {
                    let thoughtSegment = String(pendingBuffer[..<match.range.lowerBound])
                    accumulatedThinking += thoughtSegment
                    pendingBuffer.removeSubrange(..<match.range.upperBound)
                    if pendingBuffer.hasPrefix("\n") {
                        pendingBuffer.removeFirst()
                    }
                    isCurrentlyThinking = false
                    state = .postThinkingAnswer
                    keepProcessing = true
                } else if let partialIdx = trailingPartialTagIndex(in: pendingBuffer, tags: closeTags) {
                    let safeThought = String(pendingBuffer[..<partialIdx])
                    accumulatedThinking += safeThought
                    pendingBuffer.removeSubrange(..<partialIdx)
                } else {
                    accumulatedThinking += pendingBuffer
                    pendingBuffer = ""
                }

            case .postThinkingAnswer:
                if let match = findFirstTag(in: pendingBuffer, tags: closeTags) {
                    let thoughtSegment = String(pendingBuffer[..<match.range.lowerBound])
                    accumulatedThinking += thoughtSegment
                    pendingBuffer.removeSubrange(..<match.range.upperBound)
                    if pendingBuffer.hasPrefix("\n") {
                        pendingBuffer.removeFirst()
                    }
                    isCurrentlyThinking = false
                    keepProcessing = true
                } else {
                    accumulatedAnswer += pendingBuffer
                    pendingBuffer = ""
                }
            }
        }
    }

    private func findFirstTag(in text: String, tags: [String]) -> (tag: String, range: Range<String.Index>)? {
        var earliest: (String, Range<String.Index>)? = nil
        for tag in tags {
            if let range = text.range(of: tag, options: .caseInsensitive) {
                if earliest == nil || range.lowerBound < earliest!.1.lowerBound {
                    earliest = (tag, range)
                }
            }
        }
        return earliest
    }

    private func trailingPartialTagIndex(in text: String, tags: [String]) -> String.Index? {
        guard let lastAngle = text.lastIndex(of: "<") else { return nil }
        let suffix = String(text[lastAngle...]).lowercased()
        for tag in tags {
            if tag.lowercased().hasPrefix(suffix) && suffix.count < tag.count {
                return lastAngle
            }
        }
        return nil
    }
}
EOF

          if text.include?(old_parser_start) && text.include?("let suffix = String(text[lastAngle...])")
            idx1 = text.index(old_parser_start)
            idx2 = text.index(old_parser_end)
            if idx1 && idx2
              text = text[0...idx1] + new_parser + text[(idx2 + old_parser_end.length)..-1]
              puts "Successfully patched StatefulThinkingStreamParser"
            end
          end

          if text.include?("if hasThoughtOnly {\n                    var followUpMessages = apiMessages")
            text.sub!("if hasThoughtOnly {\n                    var followUpMessages = apiMessages", "if hasThoughtOnly {\n                    parser.transitionToPostThinkingAnswer()\n                    var followUpMessages = apiMessages")
            puts "Successfully patched hasThoughtOnly transition"
          end

          text.sub!("rm -rf build/dmg_staging/*\nAPP_BUNDLE=\"build/dmg_staging/${APP_NAME}.app\"", "APP_NAME=\"${APP_NAME:-AntiGravity}\"\nDISPLAY_NAME=\"${DISPLAY_NAME:-AntiGravity}\"\nBUNDLE_ID=\"${BUNDLE_ID:-com.antigravity.studio.macos}\"\nVERSION=\"${VERSION:-1.0.0}\"\nBUILD_NUMBER=\"${BUILD_NUMBER:-100}\"\nrm -rf build/dmg_staging/*\nAPP_BUNDLE=\"build/dmg_staging/${APP_NAME}.app\"")
          text.sub!("ln -fsn /Applications build/dmg_staging/Applications\nDMG_NAME=\"${APP_NAME}-${VERSION}-macOS-arm64.dmg\"", "APP_NAME=\"${APP_NAME:-AntiGravity}\"\nDISPLAY_NAME=\"${DISPLAY_NAME:-AntiGravity}\"\nVERSION=\"${VERSION:-1.0.0}\"\nln -fsn /Applications build/dmg_staging/Applications\nDMG_NAME=\"${APP_NAME}-${VERSION}-macOS-arm64.dmg\"")

          File.write("motif_build_v12.txt", text)
          puts "Patcher complete."
          RUBYEOF

          # Commit patched script to repository if changed
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add motif_build_v12.txt
          git commit -m "Initialize AntiGravity build script with reasoning parser fix" || true
          git push origin main || true

      - name: Run AntiGravity Build Script
        run: |
          chmod +x motif_build_v12.txt
          bash --noprofile --norc -e -o pipefail ./motif_build_v12.txt

      - name: Upload Compiled DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: AntiGravity-macOS-AppleSilicon-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 30
