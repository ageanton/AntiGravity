name: Build Motif macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Motif"
  DISPLAY_NAME: "Motif"
  BUNDLE_ID: "com.motif.studio.macos"
  VERSION: "1.0.0"
  BUILD_NUMBER: "100"

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 Motif Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Motif Build Script
        run: |
          if [ ! -f "motif_build_v12.txt" ]; then
            echo "Fetching Motif build script from Macos-amama-single-git..."
            curl -fsSL https://raw.githubusercontent.com/ageanton/Macos-amama-single-git/main/motif_build_v12.txt -o motif_build_v12.txt
          fi
          echo "Verifying syntax..."
          bash -n motif_build_v12.txt

      - name: Run Motif Build Script
        run: |
          chmod +x motif_build_v12.txt
          ./motif_build_v12.txt 2>&1 | tee build.log

      - name: Commit Build Log to Main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.log || true
          git commit -m "Auto-commit build log [skip ci]" || true
          git push origin main || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Motif-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Compiled DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: Motif-macOS-AppleSilicon-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 30
