name: Build BlackMotif macOS App & DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Compile Native Swift 6 BlackMotif Workstation & Package DMG (macOS 15)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Package App from Newappfile.txt
        run: |
          set -e
          echo "Starting build pointing to Newappfile.txt..."
          base64 -d << 'EOF' > run_build.pl
          
          EOF
          perl run_build.pl 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Commit Build Log to Main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.log || true
          git commit -m "Auto-commit build log [skip ci]" || true
          git push origin main || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlackMotif-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Compiled DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: BlackMotif-macOS-AppleSilicon-DMG
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 30
